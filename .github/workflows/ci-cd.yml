name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"
  TF_DIR: infra/envs/staging

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authforge
          POSTGRES_PASSWORD: authforge
          POSTGRES_DB: authforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authforge -d authforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTHFORGE_TEST_DATABASE_URL: postgresql+asyncpg://authforge:authforge@localhost:5432/authforge_test
      AUTHFORGE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Create test database
        env:
          PGPASSWORD: authforge
        run: |
          psql -h localhost -U authforge -d postgres \
            -c "SELECT 1 FROM pg_database WHERE datname = 'authforge_test'" \
            | grep -q 1 \
            || psql -h localhost -U authforge -d postgres -c "CREATE DATABASE authforge_test;"

      - name: Pytest
        run: uv run pytest

  terraform-plan:
    name: terraform-plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n... truncated ...'
              : plan;
            const body = `## Terraform plan (staging)\n\n<details><summary>plan output</summary>\n\n```\n${truncated}\n```\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  build-and-push:
    name: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repository: ${{ steps.ecr.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repository URL
        id: meta
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REPO_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/authforge"
          echo "repository=${REPO_URL}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        run: |
          # ECR tags are immutable; never retag `latest`.
          docker build -f docker/Dockerfile \
            -t "${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.image_tag }}" \
            .
          docker push "${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.image_tag }}"

  terraform-apply-and-deploy:
    name: terraform-apply-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}"

      - name: Wait for ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="$(terraform -chdir=${{ env.TF_DIR }} output -raw ecs_cluster_name)"
          SERVICE="$(terraform -chdir=${{ env.TF_DIR }} output -raw ecs_service_name)"
          # terraform apply already registers a new task definition and starts a
          # rolling deployment. A second --force-new-deployment overlaps that
          # rollout; with minimumHealthyPercent=100 the service never reaches
          # steady state inside the default 10-minute waiter.
          echo "Waiting for ${CLUSTER}/${SERVICE} to finish the Terraform rollout."
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            svc="$(aws ecs describe-services \
              --cluster "${CLUSTER}" \
              --services "${SERVICE}" \
              --output json)"
            state="$(echo "${svc}" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState')"
            reason="$(echo "${svc}" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutStateReason')"
            extra="$(echo "${svc}" | jq '[.services[0].deployments[] | select(.status!="PRIMARY")] | length')"
            echo "${svc}" | jq -c '.services[0] | {desired: .desiredCount, running: .runningCount, pending: .pendingCount, primary: (.deployments[] | select(.status=="PRIMARY") | {rolloutState, runningCount, pendingCount, failedTasks}), otherDeployments: ([.deployments[] | select(.status!="PRIMARY")] | length)}'
            echo "${state}: ${reason}"
            if [[ "${state}" == "COMPLETED" && "${extra}" == "0" ]]; then
              echo "Service is stable."
              exit 0
            fi
            if [[ "${state}" == "FAILED" ]]; then
              echo "ECS deployment failed: ${reason}"
              echo "${svc}" | jq '.services[0].events[:8]'
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the ECS service to stabilize."
          aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].events[:12]' \
            --output json
          exit 1

  smoke-test:
    name: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: terraform-apply-and-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Smoke test staging ALB
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          ALB_DNS="$(terraform output -raw alb_dns_name)"
          curl -fsS "http://${ALB_DNS}/health"
          curl -fsS "http://${ALB_DNS}/.well-known/openid-configuration"
