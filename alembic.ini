[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped, ordered filenames so `ls migrations/versions` reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# sqlalchemy.url is intentionally absent: migrations/env.py reads it from AUTHFORGE_DATABASE_URL
# via the app's Settings, so there is exactly one source of truth for the connection string.

[post_write_hooks]
# Autogenerated revisions are formatted immediately, so a generated file never fails the same
# lint gate that CI applies to hand-written code.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
