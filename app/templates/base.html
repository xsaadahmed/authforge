<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>{% block title %}AuthForge{% endblock %}</title>
    <link rel="stylesheet" href="/static/authforge.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <span class="brand">AuthForge</span>
        <span class="brand__sub">Identity Provider</span>
      </header>
      {% block content %}{% endblock %}
    </main>
    <footer class="footnote">
      {% block footnote %}Secured by AuthForge · OAuth 2.0 &amp; OpenID Connect{% endblock %}
    </footer>
  </body>
</html>
