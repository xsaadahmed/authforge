[project]
name = "authforge"
version = "0.1.0"
description = "A standards-compliant OAuth 2.0 / OpenID Connect Identity Provider built from scratch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Sync driver used only by Alembic; the application itself never opens a sync connection.
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "typer>=0.15.0",
    "python-ulid>=3.0.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[secretsmanager]>=1.35.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
authforge-admin = "app.admin_cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
]
ignore = [
    "S104",  # binding to 0.0.0.0 is intentional inside a container
    "B008",  # FastAPI Depends() in defaults is the documented idiom
    # S105/S106 flag any identifier containing "token", "secret" or "password". In an OAuth server
    # almost every protocol constant does ("TOKEN_REVOKED", "client_secret_basic", "token_type"), so
    # the rule yields only false positives here. What it is meant to catch — a real credential in
    # source — is prevented structurally instead: every secret is a `Settings` field, deployed
    # environments refuse to boot with development defaults (tests/unit/test_config.py), and the
    # logging layer redacts by field name (tests/unit/test_logging_redaction.py).
    "S105",
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]  # asserts and non-crypto randomness are expected in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["migrations/versions/", "examples/"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "qrcode.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres and Redis",
    "security: exercises a threat-model mitigation from the spec's security table",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/admin_cli.py", "app/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
